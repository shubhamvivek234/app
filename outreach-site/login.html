<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in or sign up to your Unravler Outreach workspace. Access campaigns, sequences, and conversations.">
    <meta name="theme-color" content="#0062FF">
    <title>Sign In / Sign Up | Unravler Outreach</title>
    <link rel="icon" href="assets/unravler-mark.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="login" class="auth-body">
    <a href="/" class="auth-back-link" aria-label="Return to Unravler home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to home</span>
    </a>

    <main class="auth-main-wrap" id="main">
      <div class="auth-container" id="auth-container">
        <div class="forms-container">
          <div class="signin-signup">
            <form class="sign-in-form" id="sign-in-form" autocomplete="on">
              <a class="auth-brand-logo" href="/" aria-label="Unravler home">
                <span class="brand-mark-shell" aria-hidden="true">
                  <svg viewBox="0 0 256 256" class="brand-mark-svg" role="img" aria-label="Unravler mark">
                    <path class="brand-ribbon brand-ribbon-1" d="M30 64c18-13 42-15 72-14h36c32 1 57-4 78-20 6-5 12-1 12 7v22c0 9-7 17-18 21-32 11-68 7-105 4-31-3-56 0-75 15V64Z"/>
                    <path class="brand-ribbon brand-ribbon-2" d="M30 106c19-14 44-15 75-13h40c31 0 52-5 72-19 6-4 11-1 11 6v23c0 9-7 17-18 20-32 11-68 7-105 4-31-3-56 0-75 15v-36Z"/>
                    <path class="brand-ribbon brand-ribbon-3" d="M30 148c19-14 44-15 75-13h40c31 0 52-5 72-19 6-4 11-1 11 6v23c0 9-7 17-18 20-32 11-68 7-105 4-31-3-56 0-75 15v-36Z"/>
                    <path class="brand-ribbon brand-ribbon-4" d="M30 191c19-14 44-15 75-13h40c31 0 52-5 72-19 6-4 11-1 11 6v23c0 10-8 20-21 25-32 13-69 6-105 3-30-3-54 2-72 20v-45Z"/>
                  </svg>
                </span>
                <img src="assets/unravler-wordmark-dark.png" alt="Unravler" width="126" height="44">
                
              </a>
              <div class="input-field">
                <i class="input-icon" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </i>
                <input type="text" placeholder="Username or Email" aria-label="Username or Email" required autocomplete="username">
              </div>
              <div class="input-field">
                <i class="input-icon" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </i>
                <input type="password" placeholder="Password" aria-label="Password" required autocomplete="current-password">
              </div>
              <button type="submit" class="btn solid">Login</button>
            </form>

            <form class="sign-up-form" id="sign-up-form" autocomplete="on">
              <a class="auth-brand-logo" href="/" aria-label="Unravler home">
                <span class="brand-mark-shell" aria-hidden="true">
                  <svg viewBox="0 0 256 256" class="brand-mark-svg" role="img" aria-label="Unravler mark">
                    <path class="brand-ribbon brand-ribbon-1" d="M30 64c18-13 42-15 72-14h36c32 1 57-4 78-20 6-5 12-1 12 7v22c0 9-7 17-18 21-32 11-68 7-105 4-31-3-56 0-75 15V64Z"/>
                    <path class="brand-ribbon brand-ribbon-2" d="M30 106c19-14 44-15 75-13h40c31 0 52-5 72-19 6-4 11-1 11 6v23c0 9-7 17-18 20-32 11-68 7-105 4-31-3-56 0-75 15v-36Z"/>
                    <path class="brand-ribbon brand-ribbon-3" d="M30 148c19-14 44-15 75-13h40c31 0 52-5 72-19 6-4 11-1 11 6v23c0 9-7 17-18 20-32 11-68 7-105 4-31-3-56 0-75 15v-36Z"/>
                    <path class="brand-ribbon brand-ribbon-4" d="M30 191c19-14 44-15 75-13h40c31 0 52-5 72-19 6-4 11-1 11 6v23c0 10-8 20-21 25-32 13-69 6-105 3-30-3-54 2-72 20v-45Z"/>
                  </svg>
                </span>
                <img src="assets/unravler-wordmark-dark.png" alt="Unravler" width="126" height="44">
                
              </a>
              <div class="input-field">
                <i class="input-icon" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </i>
                <input type="text" placeholder="Username" aria-label="Username" required autocomplete="username">
              </div>
              <div class="input-field">
                <i class="input-icon" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </i>
                <input type="email" placeholder="Email" aria-label="Email" required autocomplete="email">
              </div>
              <div class="input-field">
                <i class="input-icon" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </i>
                <input type="password" placeholder="Password" aria-label="Password" required autocomplete="new-password">
              </div>
              <button type="submit" class="btn solid">Sign up</button>
            </form>
          </div>
        </div>

        <div class="panels-container">
          <div class="panel left-panel">
            <div class="content">
              <h3>New here?</h3>
              <p>Sign up and discover how Unravler accelerates and organizes your outreach workflows.</p>
              <button class="btn transparent" id="sign-up-btn" type="button">Sign up</button>
            </div>
          </div>
          <div class="panel right-panel">
            <div class="content">
              <h3>One of us?</h3>
              <p>Welcome back! Sign in to keep managing your outreach campaigns and conversations.</p>
              <button class="btn transparent" id="sign-in-btn" type="button">Sign in</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const container = document.getElementById('auth-container');
      const signUpBtn = document.getElementById('sign-up-btn');
      const signInBtn = document.getElementById('sign-in-btn');

      if (signUpBtn && container) {
        signUpBtn.addEventListener('click', () => {
          container.classList.add('sign-up-mode');
        });
      }

      if (signInBtn && container) {
        signInBtn.addEventListener('click', () => {
          container.classList.remove('sign-up-mode');
        });
      }

      if (window.location.hash === '#signup' || new URLSearchParams(window.location.search).get('mode') === 'signup') {
        container.classList.add('sign-up-mode');
      }

      document.getElementById('sign-in-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
      });

      document.getElementById('sign-up-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
      });
    </script>
  </body>
</html>
